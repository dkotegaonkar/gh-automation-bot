name: API — test, build, deploy

on:
  push:
    branches: [main]
    paths: ["apps/api/**", "infra/**", "pnpm-lock.yaml", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gh-automation-bot-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter api...
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api typecheck
      - run: pnpm --filter api test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter api...
      - run: pnpm --filter api exec prisma migrate deploy
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

  deploy:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    environment: production
    steps:
      - uses: actions/checkout@v4
      # Port 22 is closed to the internet. The github-deploy IAM user may only add/remove ingress rules
      # on this instance's security group: open 22 for this runner's IP, deploy, always close it again.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Open temporary SSH window for this runner
        id: sshwin
        run: |
          IP=$(curl -fsS https://checkip.amazonaws.com)
          aws ec2 authorize-security-group-ingress --group-id "${{ vars.EC2_SECURITY_GROUP_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${IP}/32,Description=gh-actions-run-${{ github.run_id }}}]"
          echo "ip=${IP}" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem && chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H ${{ vars.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: Upload compose files
        run: scp -i ~/.ssh/deploy.pem infra/docker-compose.yml infra/Caddyfile ubuntu@${{ vars.EC2_HOST }}:/opt/gh-bot/
      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy.pem ubuntu@${{ vars.EC2_HOST }} bash -s <<EOSSH
          set -euo pipefail
          cd /opt/gh-bot
          # Short-lived token for this pull only; logged out immediately after.
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export GHCR_OWNER=${{ github.repository_owner }} IMAGE_TAG=${{ github.sha }} API_DOMAIN=${{ vars.API_DOMAIN }}
          # Small disk: drop images no container uses (old SHA-tagged releases) before and after pulling.
          docker image prune -af
          df -h / | tail -1
          docker compose pull
          docker compose up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -af
          EOSSH
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://${{ vars.API_DOMAIN }}/api/health/ready && exit 0
            sleep 5
          done
          echo "API did not become ready" && exit 1
      - name: Close SSH window
        if: always() && steps.sshwin.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "${{ vars.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "${{ steps.sshwin.outputs.ip }}/32"
